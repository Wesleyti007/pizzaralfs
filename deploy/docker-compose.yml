services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: pizzaralfs
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: pizzaralfs
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../backend/sql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ../backend/sql/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U pizzaralfs -d pizzaralfs']
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        APP_RELEASE: ${APP_RELEASE:-dev}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      APP_RELEASE: ${APP_RELEASE:-dev}
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_API_KEY: ${ADMIN_API_KEY:-}
      WAITER_USER: ${WAITER_USER:-garcom}
      WAITER_PASSWORD: ${WAITER_PASSWORD:-}
      WAITER_API_KEY: ${WAITER_API_KEY:-}
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: pizzaralfs
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: pizzaralfs
    volumes:
      # Permite publicar com rsync + build no Mac (sem rebuild Docker quando Hub falha)
      - ../dist:/app/dist:ro
      - ../backend/src:/app/backend/src:ro
    depends_on:
      db:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  pgdata:
  caddy_data:
  caddy_config:
